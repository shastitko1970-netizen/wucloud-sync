<div id="wucloud-sync-panel" class="wucloud-panel">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-cloud"></i> WuCloud Sync</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content" style="display: none;">
            <div class="wucloud-settings">
                <p class="wucloud-lead">
                    Бэкап в облако
                    <a href="https://wuproj.com/dashboard?tab=files" target="_blank" rel="noopener">WuProj · Файлы ИИ</a>.
                    Ключ: только <b>wu-…</b> из Dashboard → API keys (не JWT и не пароль).
                </p>

                <div class="wucloud-field">
                    <label for="wucloud_api_key">API-ключ (wu-…)</label>
                    <input type="password" id="wucloud_api_key" class="text_pole" placeholder="wu-..." autocomplete="off">
                </div>

                <div class="wucloud-field">
                    <label for="wucloud_base_url">API base URL</label>
                    <input type="text" id="wucloud_base_url" class="text_pole" placeholder="https://api.wuproj.com">
                </div>

                <div class="wucloud-buttons">
                    <button id="wucloud_test_btn" class="menu_button" type="button">
                        <i class="fa-solid fa-plug"></i> Проверить ключ
                    </button>
                </div>

                <div class="wucloud-section-title">Что синхронизировать</div>
                <div class="wucloud-toggles">
                    <label class="wucloud-check"><input type="checkbox" id="wucloud_sync_characters" checked> Персонажи (карты)</label>
                    <label class="wucloud-check"><input type="checkbox" id="wucloud_sync_chats" checked> Диалоги (чаты)</label>
                    <label class="wucloud-check"><input type="checkbox" id="wucloud_sync_personas" checked> Personas (профили)</label>
                    <label class="wucloud-check"><input type="checkbox" id="wucloud_sync_lorebooks" checked> Лорбуки (World Info)</label>
                    <label class="wucloud-check"><input type="checkbox" id="wucloud_sync_presets" checked> Пресеты генерации</label>
                    <label class="wucloud-check"><input type="checkbox" id="wucloud_use_gzip" checked> Gzip (сжатие на клиенте + gunzip на сервере)</label>
                </div>

                <div class="wucloud-section-title">Автосохранение диалогов</div>
                <div class="wucloud-field">
                    <label for="wucloud_autosave">Режим</label>
                    <select id="wucloud_autosave" class="text_pole">
                        <option value="off">Выкл</option>
                        <option value="message">После сообщения (debounce)</option>
                        <option value="interval">По таймеру</option>
                    </select>
                </div>
                <div class="wucloud-field">
                    <label for="wucloud_debounce_ms">Debounce / интервал (сек)</label>
                    <input type="number" id="wucloud_debounce_ms" class="text_pole" min="2" max="300" value="8">
                </div>

                <div class="wucloud-buttons">
                    <button id="wucloud_push_btn" class="menu_button" type="button" title="Push по выбранным типам">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Push
                    </button>
                    <button id="wucloud_push_chat_btn" class="menu_button" type="button">
                        <i class="fa-solid fa-comment"></i> Текущий чат
                    </button>
                    <button id="wucloud_push_all_chats_btn" class="menu_button" type="button" title="Все чаты текущего персонажа">
                        <i class="fa-solid fa-comments"></i> Все чаты персонажа
                    </button>
                    <button id="wucloud_pull_btn" class="menu_button" type="button" title="Pull из облака в ST">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Pull
                    </button>
                </div>

                <div id="wucloud_status" class="wucloud-status">Готов</div>
                <div id="wucloud_log" class="wucloud-log"></div>

                <div class="wucloud-foot">
                    <span>v0.7.1</span>
                    ·
                    <a href="https://github.com/shastitko1970-netizen/wucloud-sync" target="_blank" rel="noopener">GitHub</a>
                    · branch: main / wucloud
                </div>
            </div>
        </div>
    </div>
</div>
